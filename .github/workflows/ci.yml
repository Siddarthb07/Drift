name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt PyYAML pytest
      - name: Unit tests
        env:
          DRIFT_AUDIT: "0"
        run: pytest -q
      - name: Claim ledger
        env:
          DRIFT_AUDIT: "0"
        run: python scripts/validate_claims.py
      - name: Vignette honesty eval
        env:
          DRIFT_AUDIT: "0"
        run: python scripts/eval_vignettes.py
      - name: Baseline git pin
        run: python scripts/baseline_git_pin.py
      - name: Metamorphic honesty
        env:
          DRIFT_AUDIT: "0"
        run: pytest -q tests/test_metamorphic.py
