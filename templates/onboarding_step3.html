{% extends "layout.html" %}
{% block title %}Setup — Step {{ step }}{% endblock %}
{% block content %}
<div class="onboard-wrap">
  <div class="step-indicator">
    <div class="step-dot done"></div>
    <div class="step-dot active"></div>
    <div class="step-dot"></div>
  </div>

  <div class="panel onboard-panel">
    <h2 class="onboard-title">Vitals &amp; habits</h2>
    <p class="onboard-sub">Systolic blood pressure is required for a CVD band. We never invent 120 mmHg.</p>
    <form method="post" novalidate>
      <div class="form-grid-2">
        <div class="field">
          <label for="systolic">Systolic BP (mmHg)</label>
          <input id="systolic" name="systolic" type="number" value="{{ user.systolic or '' }}" placeholder="e.g. 118">
        </div>
        <div class="field">
          <label for="diastolic">Diastolic BP (mmHg)</label>
          <input id="diastolic" name="diastolic" type="number" value="{{ user.diastolic or '' }}" placeholder="e.g. 76">
        </div>
        <div class="field">
          <label for="resting_hr">Resting heart rate (bpm)</label>
          <input id="resting_hr" name="resting_hr" type="number" value="{{ user.resting_hr or '' }}" placeholder="e.g. 62">
        </div>
        <div class="field">
          <label for="alcohol_per_week">Alcohol (drinks / week)</label>
          <input id="alcohol_per_week" name="alcohol_per_week" type="number" step="0.5" min="0" value="{{ user.alcohol_per_week or 0 }}" placeholder="e.g. 3">
        </div>
        <div class="field field-span-2">
          <label for="smoking_status">Smoking status</label>
          <select id="smoking_status" name="smoking_status">
            <option value="never" {% if (user.smoking_status or 'never')=='never' %}selected{% endif %}>Never smoked</option>
            <option value="ex" {% if user.smoking_status=='ex' %}selected{% endif %}>Ex-smoker</option>
            <option value="current" {% if user.smoking_status=='current' %}selected{% endif %}>Current smoker</option>
          </select>
        </div>
      </div>
      <label class="chip-check" style="margin-top:14px;">
        <input type="checkbox" name="bp_medication" {% if user.bp_medication %}checked{% endif %}>
        <span>I take blood pressure medication</span>
      </label>
      <div class="form-actions">
        <button class="btn" type="submit" style="flex:1;justify-content:center;">Continue</button>
      </div>
    </form>
  </div>
  <p class="onboard-footer">Step 2 of 3 — you can edit this later in Profile</p>
</div>
{% endblock %}
