{% extends "layout.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div style="max-width:420px;margin:60px auto;">
  <div style="text-align:center;margin-bottom:28px;">
    <div style="font-size:28px;margin-bottom:8px;">🏥</div>
    <h1 style="font-size:22px;font-weight:700;letter-spacing:-0.5px;">Create your account</h1>
    <div class="muted" style="font-size:14px;margin-top:4px;">Free, private, evidence-based health tracking</div>
  </div>
  <div class="card">
    <form method="post" novalidate>
      <label>Choose a username</label>
      <input name="username" type="text" autofocus autocomplete="username" placeholder="e.g. john_doe">
      <label>Create a password</label>
      <input name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters">
      <div class="alert alert-info" style="margin-top:12px;">
        <span>🔒</span>
        <div style="font-size:12px;">Your password is hashed with bcrypt and never stored in plain text. No email required.</div>
      </div>
      <div class="form-row" style="margin-top:20px;">
        <button class="btn" type="submit" style="width:100%;justify-content:center;">Create account</button>
      </div>
    </form>
    <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-2);">
      Already have an account? <a href="{{ url_for('login') }}" style="color:var(--teal);">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
