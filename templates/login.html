{% extends "layout.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="max-width:420px;margin:60px auto;">
  <div style="text-align:center;margin-bottom:28px;">
    <div style="font-size:28px;margin-bottom:8px;">👋</div>
    <h1 style="font-size:22px;font-weight:700;letter-spacing:-0.5px;">Welcome back</h1>
    <div class="muted" style="font-size:14px;margin-top:4px;">Sign in to continue tracking your health</div>
  </div>
  <div class="card">
    <form method="post" novalidate>
      <label>Username</label>
      <input name="username" type="text" autofocus autocomplete="username" placeholder="your username">
      <label>Password</label>
      <input name="password" type="password" autocomplete="current-password" placeholder="••••••••">
      <div class="form-row" style="margin-top:20px;">
        <button class="btn" type="submit" style="width:100%;justify-content:center;">Sign in</button>
      </div>
    </form>
    <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-2);">
      No account? <a href="{{ url_for('register') }}" style="color:var(--teal);">Create one free</a>
    </div>
  </div>
</div>
{% endblock %}
