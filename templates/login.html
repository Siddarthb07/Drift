{% extends "layout.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-shell">
  <header class="auth-header">
    <p class="auth-kicker">Account</p>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to continue your health profile and risk disclosure.</p>
  </header>
  <div class="auth-panel">
    <form method="post" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autofocus autocomplete="username" placeholder="Your username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
      <div class="form-row" style="margin-top:24px;">
        <button class="btn" type="submit" style="width:100%;justify-content:center;">Sign in</button>
      </div>
    </form>
  </div>
  <p class="auth-footer">
    New here? <a href="{{ url_for('register') }}">Create an account</a>
  </p>
</div>
{% endblock %}
